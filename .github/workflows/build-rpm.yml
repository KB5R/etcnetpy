name: build-rpm

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check
        run: |
          python3 -m py_compile main.py
          python3 main.py --help

      - name: Build RPM in ALT container
        run: docker run --rm -v "$PWD":/src docker.io/library/alt:p10 bash /src/.github/scripts/build-rpm.sh

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: etcnetpy-rpm
          path: dist/*.rpm

      # Fires on 'git push --tags' and also if the tag/release was created
      # via the GitHub web UI (that pushes a tag too, which triggers this
      # same job). If a release for the tag already exists (e.g. drafted
      # from the web before this ran), attach the RPMs to it instead of
      # failing on "already exists".
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" dist/*.rpm --title "$TAG" --generate-notes \
            || gh release upload "$TAG" dist/*.rpm --clobber
