name: build-rpm

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check
        run: |
          python3 -m py_compile main.py
          python3 main.py --help

      - name: Build RPM in ALT container
        run: docker run --rm -v "$PWD":/src docker.io/library/alt:p10 bash /src/.github/scripts/build-rpm.sh

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: etcnetpy-rpm
          path: dist/*.rpm
